name: transactions-ingest

services:
  backend:
    build:
      context: ./server
    environment:
      # Local evaluation setup: enables Swagger, not a production deployment profile.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Data Source=/data/transactions.db"
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5052}:8080"
    volumes:
      - transaction-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  transaction-data:
